      configs:
        Debug:
          KEYBOARD_NAME: "mk $(MARKETING_VERSION)"
        Release:
          KEYBOARD_NAME: makedonsky
    info:
      path: KeyboardMK/Info.plist
      properties:
        CFBundleDisplayName: $(KEYBOARD_NAME)
        # Without these two XcodeGen writes a literal 1.0 / 1 into the plist, so
        # MARKETING_VERSION never reached the build and every TestFlight upload
        # would carry the same build number - the second one is rejected.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KeyboardLanguage: mk
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
