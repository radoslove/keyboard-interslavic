        KeyboardLanguage: pl
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            # Asked for since 0.4.0 (owner 2026-10-25), and only for the App
            # Group: without it the app cannot see the words added with `＋`
            # nor hand the keyboard a theme. The keyboard works in full with
            # it switched OFF (Shared.swift falls back to its own defaults),
            # and it has no network code either way - unlike Keyman on iOS 16+,
            # which renders blank until Full Access is on.
            RequestsOpenAccess: true
            # `mul` (multiple languages), NOT `isv`, however correct that
            # code is elsewhere. The language identity lives in the layout and
            # the wordlist; this key is only a hint to the picker.
            PrimaryLanguage: pl
            IsASCIICapable: false
            # All FOUR of these attributes must be present. Ours had three,
            # and the failure mode is silent in every direction: the build
            # succeeds, the install succeeds, the device logs a healthy
            # `PluginKit app extension Placeholder`, SpringBoard even finds the
            # keyboard-service extension point - and Add New Keyboard simply
            # never lists it. Hours went into hunting a caching problem that
            # did not exist, including a pointless device reboot.
            #
            # The fix that ended it was checking this file against a keyboard
            # KNOWN to work on the same iPad - Keyman is open source, and
            # ios/keyman/Keyman/SWKeyboard/Info.plist differed in exactly two
            # places: this key, and `isv` where Keyman has `mul`. BOTH were
