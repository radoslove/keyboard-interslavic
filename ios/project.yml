# XcodeGen spec. The .xcodeproj is GENERATED, never committed - a pbxproj is
# unreadable in review and conflicts on every merge. Regenerate with:
#
#     cd ios && xcodegen generate
#
# Xcode is still required to BUILD; this only removes the need to hand-build
# the project file.

name: InterslavicKeyboard
options:
  bundleIdPrefix: com.radoslove.interslavic
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.5.17"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Read from the environment so it never lands in the repo, and - more
    # importantly - so it SURVIVES. Picking the team in Xcode's UI writes it
    # into the .xcodeproj, which is generated and gitignored: the next
    # `xcodegen generate` silently wipes it and device builds start failing to
    # sign for no visible reason.
    #
    #   export DEVELOPMENT_TEAM=XXXXXXXXXX   (or put it in ~/.zshrc)
    #   xcodegen generate
    #
    # A free Personal Team is enough to run on your own device; the profile
    # expires after 7 days and you rebuild. $99/year is only for distribution.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
  # Test builds show their number in Settings -> Keyboards, so two builds can
  # be told apart on the phone (owner, 2026-10-08: shorter, with the version).
  configs:
    Debug:
      KEYBOARD_NAME: "isv $(MARKETING_VERSION)"
    Release:
      KEYBOARD_NAME: Medžuslovjansky

targets:
  InterslavicKeyboard:
    type: application
    platform: iOS
    sources: [App, Shared]
    # One App Group for the app and both keyboards: the words added with `＋`,
    # the theme and the script. A keyboard reaches it only with Full Access.
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.radoslove.interslavic]
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    # Without this XcodeGen emits NO schemes at all, Xcode autocreates one for
    # the EXTENSION instead, and Run then asks which host app to launch it in -
    # which looks like a signing problem and is not one. Paid for 2026-08-20.
    scheme:
      testTargets: []
    settings:
      base:
        # iOS requires the extension's id to be a CHILD of the app's id, not a
        # sibling. XcodeGen's bundleIdPrefix alone produces siblings and the
        # link step rejects it, so both ids are stated explicitly.
        PRODUCT_BUNDLE_IDENTIFIER: com.radoslove.interslavic
        # The App Store and TestFlight reject an upload without an app icon.
        # One 1024 px image (brand/src/icon_b_hearts.svg, the chosen mark), no
        # alpha channel; Xcode derives every smaller size from it.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        # The app is Interslove on the home screen, as in the stores (owner
        # 2026-11-07); the KEYBOARDS keep their language names, and the space
        # bar shows which one is on.
        CFBundleDisplayName: Interslove
        # Without these two XcodeGen writes a literal 1.0 / 1 into the plist, so
        # MARKETING_VERSION never reached the build and every TestFlight upload
        # would carry the same build number - the second one is rejected.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # No cryptography of our own (no network code at all), so the upload
        # needs no export-compliance documents.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad needs all four for multitasking, or App Store Connect rejects
        # the upload ("Invalid bundle ... to support iPad multitasking",
        # 2026-11-05). The iPhone list above stays as it was.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: Keyboard
      - target: KeyboardPL
      - target: KeyboardEN
      - target: KeyboardCS
      - target: KeyboardNB
      - target: KeyboardSK
      - target: KeyboardSL
      - target: KeyboardHR
      - target: KeyboardSR
      - target: KeyboardBS
      - target: KeyboardMK
      - target: KeyboardRU

  Keyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
        excludes: ["Resources/pl_swipe.bin", "Resources/en_swipe.bin", "Resources/cs_swipe.bin", "Resources/nb_swipe.bin", "Resources/sk_swipe.bin", "Resources/sl_swipe.bin", "Resources/hr_swipe.bin", "Resources/sr_swipe.bin", "Resources/bs_swipe.bin", "Resources/mk_swipe.bin", "Resources/ru_swipe.bin"]
      - path: Shared
    entitlements:
      path: Keyboard/Keyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.radoslove.interslavic]
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.radoslove.interslavic.keyboard
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: $(KEYBOARD_NAME)
        # Without these two XcodeGen writes a literal 1.0 / 1 into the plist, so
        # MARKETING_VERSION never reached the build and every TestFlight upload
        # would carry the same build number - the second one is rejected.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KeyboardLanguage: isv
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            # Asked for since 0.4.0 (owner 2026-10-25), and only for the App
            # Group: without it the app cannot see the words added with `＋`
            # nor hand the keyboard a theme. The keyboard works in full with
            # it switched OFF (Shared.swift falls back to its own defaults),
            # and it has no network code either way - unlike Keyman on iOS 16+,
            # which renders blank until Full Access is on.
            RequestsOpenAccess: true
            # `mul` (multiple languages), NOT `isv`, however correct that
            # code is elsewhere. The language identity lives in the layout and
            # the wordlist; this key is only a hint to the picker.
            PrimaryLanguage: mul
            IsASCIICapable: false
            # All FOUR of these attributes must be present. Ours had three,
            # and the failure mode is silent in every direction: the build
            # succeeds, the install succeeds, the device logs a healthy
            # `PluginKit app extension Placeholder`, SpringBoard even finds the
            # keyboard-service extension point - and Add New Keyboard simply
            # never lists it. Hours went into hunting a caching problem that
            # did not exist, including a pointless device reboot.
            #
            # The fix that ended it was checking this file against a keyboard
            # KNOWN to work on the same iPad - Keyman is open source, and
            # ios/keyman/Keyman/SWKeyboard/Info.plist differed in exactly two
            # places: this key, and `isv` where Keyman has `mul`. BOTH were
            # changed in one build and the keyboard appeared, so which of the
            # two was decisive is NOT established - do not read this comment as
            # saying `isv` alone was fatal. Paid for 2026-08-20.
            PrefersRightToLeft: false

  KeyboardPL:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
        # Same code, other wordlist. Its own Info.plist is generated below,
        # so the isv one must not be copied in as a resource.
        excludes: ["Resources/isv_swipe.bin", "Resources/en_swipe.bin", "Resources/cs_swipe.bin", "Resources/nb_swipe.bin", "Resources/sk_swipe.bin", "Resources/sl_swipe.bin", "Resources/hr_swipe.bin", "Resources/sr_swipe.bin", "Resources/bs_swipe.bin", "Resources/mk_swipe.bin", "Resources/ru_swipe.bin", "Info.plist"]
      - path: Shared
    entitlements:
      path: KeyboardPL/KeyboardPL.entitlements
      properties:
        com.apple.security.application-groups: [group.com.radoslove.interslavic]
    attributes:
      SystemCapabilities:
